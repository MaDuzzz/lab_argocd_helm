# Example values for StatefulSet deployment
# Ứng dụng cần: stable identity, persistent storage (DB, cache, etc)
# Ví dụ: PostgreSQL, MongoDB, Elasticsearch, RabbitMQ, etc

namespace: production

# Image
image:
  repository: nexus.example.com:8082/my-company/stateful-app
  tag: v1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: nexus-registry-secret

# DISABLE Deployment
deployment:
  enabled: false

# ENABLE StatefulSet
statefulSet:
  enabled: true
  replicas: 3 # Số pod (thường 3 cho HA)
  serviceName: my-app-stateful # Headless service name
  podManagementPolicy: OrderedReady # Chờ pod trước ready mới tạo pod kế tiếp
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0 # Update từ cuối (my-app-2 trước)
  # Headless service (clusterIP: None) - tạo tự động
  headlessService:
    enabled: true
  # Persistent storage - tạo tự động cho mỗi pod
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi # 20GB per pod
        storageClassName: fast-ssd

# Pod config
pod:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  containers:
    - name: app
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      env:
        - name: ROLE
          value: "stateful"
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi
      startupProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 0
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /ready
          port: http
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 1
      volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/config

  volumes:
    - name: config
      configMap:
        name: stateful-app-config

# Headless Service (cho DNS resolution)
service:
  enabled: false # StatefulSet tạo riêng headless service

# ConfigMap
configMap:
  enabled: true
  name: stateful-app-config
  data:
    ENV: production
  files:
    app-config.yaml: |
      app:
        name: stateful-app
        replicas: 3
      persistence:
        enabled: true
        path: /data

# Không cần PVC - StatefulSet tự động tạo via volumeClaimTemplates
pvc:
  enabled: false

# HPA không dùng cho StatefulSet (không nên auto-scale stateful apps)
hpa:
  enabled: false

# PDB - quan trọng cho StatefulSet
pdb:
  enabled: true
  minAvailable: 1

# Pod Anti-Affinity - spread pods across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - my-app-chart
          topologyKey: kubernetes.io/hostname

serviceAccount:
  create: true
  name: stateful-app-sa
