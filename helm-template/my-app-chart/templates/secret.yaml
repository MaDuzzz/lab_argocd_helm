{{- if .Values.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "my-app-chart.labels" . | nindent 4 }}
type: {{ .Values.secret.type }}
data:
  {{- toYaml .Values.secret.data | nindent 2 }}
{{- end }}
