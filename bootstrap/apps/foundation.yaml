apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sit-foundation-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/MaDuzzz/lab_argocd_helm.git"
    targetRevision: SIT
    path: apps/foundation
  destination:
    server: "https://default.svc"
    namespace: app-sit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
